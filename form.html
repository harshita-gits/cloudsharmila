<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit Card Fraud Detection</title>
  <link rel="stylesheet" href="formstyle.css">
</head>
<body>
  <!-- Background Image -->
  <div class="background-image"></div>

  <!-- Transparent Overlay -->
  <div class="overlay"></div>

  <!-- Form Container -->
  <div class="form-container">
    <h1>Credit Card Fraud Detection</h1>
    <form id="fraudForm">
      <!-- Scrollable Section for V1-V28 Fields -->
      <div class="scrollable-section">
        <div class="form-group">
          <label for="vFields"></label>
          <div class="v-fields" id="vFields">
            <!-- Fields will be inserted here by JavaScript -->
          </div>
        </div>
      </div>

      <!-- Amount Field -->
      <div class="form-group">
        <label for="amount">Amount</label>
        <input type="number" step="0.01" id="amount" name="amount" placeholder="Enter Amount" required>
      </div>

      <!-- Credit Card Image Upload -->
      <div class="form-group">
        <label for="cardImage">Upload Credit Card Image</label>
        <div class="file-upload">
          <input type="file" id="cardImage" name="cardImage" accept="image/*" required>
          <span>Choose File</span>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit">Submit</button>
    </form>
  </div>

  <script src="formscript.js"></script>
</body>
</html>
